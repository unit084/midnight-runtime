name: Update videos & publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours: pick up new YouTube videos
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch new YouTube videos
        id: yt
        run: python scripts/update_videos.py

      - name: Save new videos to the repository
        if: steps.yt.outputs.changed == 'true'
        run: |
          git config user.name "midnight-runtime-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json assets/thumbs/yt
          git commit -m "Update YouTube videos"
          git push

      - name: Publish
        if: github.event_name != 'schedule' || steps.yt.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'schedule' || steps.yt.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deploy
        if: github.event_name != 'schedule' || steps.yt.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
